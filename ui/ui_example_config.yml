language: "Deutsch"  # Literal["Deutch", "English"]. 

legal:
  data_protection: "https://my_example.de/datenschutz/"
  imprint: "https://my_example.de/impressum/"

# Endpoint of the askUOS backend (required). The api key is set in the env file
# (STREAMLIT_API_KEY). Behind Caddy (prod) e.g. "http://caddy/v1"; for a local
# backend e.g. "http://localhost:8000/v1". See docs/Caddy.example.j2.
api:
  api_url: "http://caddy/v1"

ui:
  page_title: "ask.UOS" #app name
  # Optional. Defaults shown below — either mount your own icon files over
  # these exact paths with the same filenames (see note further down), or
  # point these at wherever you've actually placed your custom icons.
  # human_avatar_path: "/app/ui/static/icons/Icon-User.svg"
  # assistant_avatar_path: "/app/ui/static/icons/Icon-chatbot.svg"
  # favicon_path: "/app/ui/static/icons/Icon-chatbot.png"


start_page:
  welcome_message_english: "Welcome to our chatbot! How can I assist you today?"
  welcome_message_german: "Willkommen bei unserem Chatbot! Wie kann ich Ihnen heute helfen?"


chat_page:
    # Configuration for the start page
  delete_message_dialog_box_english: |
    Are you sure you want to delete the chat history? This action cannot be undone.
  delete_message_dialog_box_german: |
    Sind Sie sicher, dass Sie den Chatverlauf löschen möchten? Diese Aktion kann nicht rückgängig gemacht werden.
  greeting_message_english: |
    Hello! I am happy to assist you with questions about the University of Osnabrück, including information about study programs, application processes, and admission requirements. \n How can I help you today?
  greeting_message_german: |
    Hallo! Ich unterstütze Sie gerne bei Fragen zur Universität Osnabrück, einschließlich Informationen zu Studiengängen, Bewerbungsprozessen und Zulassungsvoraussetzungen.\n Wie kann ich Ihnen heute helfen?

# Note: For the icons, mount (to the container) your own custom icons to the /app/ui/static/icons/ directory with the same filenames (Icon-User.svg, Icon-chatbot.svg, Icon-chatbot.png). 

# Optional: different texts when the bot is opened from specific pages of the
# host website. `match` is compared with the `page` query parameter sent by the
# embed snippet, which can be a path ("/hochschulsport") or include the
# hostname ("sport.example.de" or "sport.example.de/kurse"). It matches that
# page and everything below it (case-insensitive, scheme/"www." ignored); the
# longest match wins. Any field left out falls back to start_page / chat_page
# above. First remove the leading "#" of the lines below.
# page_overrides:
#   - match: "sport.example.de"
#     welcome_message_german: "Willkommen beim Hochschulsport-Assistenten! ..."
#     welcome_message_english: "Welcome to the university sports assistant! ..."
#     greeting_message_german: "Hallo! Haben Sie Fragen zum Hochschulsport? Fragen Sie einfach!"
#     greeting_message_english: "Hello! Do you have questions about university sports? Just ask!"
#     # Status line shown while the bot works, per status code (searching_web,
#     # searching_documents, consulting_specialist, checking_response,
#     # checking_documents, refining_search). Codes left out keep the defaults.
#     status_messages_german:
#       searching_web: "Ich suche nach Informationen zum Hochschulsport..."
#     status_messages_english:
#       searching_web: "I'm looking up information about university sports..."
